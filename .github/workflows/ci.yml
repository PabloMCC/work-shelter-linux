# Comprobación de cada cambio en Linux y macOS: instala con pnpm (solo ejecutan scripts de instalación los paquetes
# de allowBuilds en pnpm-workspace.yaml) y pasa el typecheck y los tests. Las acciones van fijadas por hash de commit
# (una etiqueta se puede mover; un hash no) con la versión al lado.
name: CI

on:
  push:
    branches: [main, 'fase-*/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comprobar:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # la versión de pnpm sale de packageManager en package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      # --frozen-lockfile: exactamente lo de pnpm-lock.yaml; --prod=false por si el entorno trae NODE_ENV=production.
      # Solo ejecutan scripts de instalación los paquetes de allowBuilds (pnpm-workspace.yaml); cualquier otro hace
      # fallar la instalación. El binario de Electron no se descarga: los tests no deben depender de él (lo que
      # necesite Electron va en los scripts qa-*).
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile --prod=false

      - name: Typecheck
        run: pnpm run typecheck

      - name: Tests
        run: pnpm test
        env:
          FORCE_COLOR: '0'
